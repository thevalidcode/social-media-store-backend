user_update:
  tags: [Users]
  summary: Update user info
  description: Allows updating user information by UID. Only specific fields are accepted.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/UserUpdateRequest"
  responses:
    "200":
      $ref: "../components/responses.yaml#/UpdateSuccess"
    "400":
      $ref: "../components/responses.yaml#/InvalidData"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

user_get_all:
  tags: [Users]
  summary: Get all users
  security: [{ bearerAuth: [] }]
  responses:
    "200":
      $ref: "../components/responses.yaml#/UsersListResponse"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

user_create:
  tags: [Users]
  summary: Create a new user
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/CreateUserInput"
  responses:
    "204":
      $ref: "../components/responses.yaml#/SuccessMessage"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

user_delete:
  tags: [Users]
  summary: Delete a single user
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [uid]
          properties:
            uid:
              type: string
  responses:
    "200":
      $ref: "../components/responses.yaml#/SuccessMessage"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

user_me:
  get:
    tags: [Users]
    summary: Authenticate and log in a user
    parameters:
      - in: query
        name: email
        schema: { type: string }
      - in: query
        name: password
        schema: { type: string }
      - in: query
        name: panel_id
        schema: { type: number }
    responses:
      "200":
        $ref: "../components/responses.yaml#/LoginResponse"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

user_uid:
  get:
    tags: [Users]
    summary: Get a user by UID
    security: [{ bearerAuth: [] }]
    parameters:
      - in: path
        name: uid
        required: true
        schema: { type: string }
    responses:
      "200":
        $ref: "../components/responses.yaml#/UserObject"
      "403":
        $ref: "../components/responses.yaml#/AccessDenied"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

user_multiple:
  delete:
    tags: [Users]
    summary: Delete multiple users
    security: [{ bearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [uids]
            properties:
              uids:
                type: array
                items: { type: string }
    responses:
      "200":
        $ref: "../components/responses.yaml#/SuccessMessage"
      "400":
        $ref: "../components/responses.yaml#/BadRequest"
      "403":
        $ref: "../components/responses.yaml#/AccessDenied"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
