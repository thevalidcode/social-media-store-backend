service_get_all:
  tags: [Services]
  summary: Get all active services
  description: Returns a list of active services available to users.
  parameters:
    - in: query
      name: panel_id
      schema:
        type: number
      required: true
  responses:
    "200":
      description: List of services
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas.yaml#/ServicePublic"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

service_get_admin:
  tags: [Services]
  summary: Get all services for admins
  security: [{ bearerAuth: [] }]
  description: Returns a full list of services regardless of status. Only accessible by admins.
  responses:
    "200":
      description: List of services
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../components/schemas.yaml#/Service"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

service_by_provider:
  tags: [Services]
  summary: Get services by provider ID
  security: [{ bearerAuth: [] }]
  parameters:
    - in: path
      name: provider_id
      required: true
      schema:
        type: number
  responses:
    "200":
      description: Filtered services list
      content:
        application/json:
          schema:
            type: object
            properties:
              services:
                type: array
                items:
                  $ref: "../components/schemas.yaml#/Service"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

service_by_id:
  tags: [Services]
  summary: Get a service by ID (public)
  parameters:
    - in: path
      name: service_id
      required: true
      schema:
        type: number
    - in: query
      name: panel_id
      required: true
      schema:
        type: number
  responses:
    "200":
      description: Service details
      content:
        application/json:
          schema:
            type: object
            properties:
              service:
                $ref: "../components/schemas.yaml#/ServicePublic"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

service_by_id_admin:
  tags: [Services]
  summary: Get a service by ID (admin)
  security: [{ bearerAuth: [] }]
  parameters:
    - in: path
      name: service_id
      required: true
      schema:
        type: number
  responses:
    "200":
      description: Service details
      content:
        application/json:
          schema:
            type: object
            properties:
              service:
                $ref: "../components/schemas.yaml#/Service"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

service_update:
  tags: [Services]
  summary: Update a service
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/ServiceUpdateInput"
  responses:
    "200":
      description: Updated service object
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: string
                example: Service updated successfully.
              service:
                $ref: "../components/schemas.yaml#/Service"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

service_delete:
  tags: [Services]
  summary: Delete a single service
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [uid]
          properties:
            uid:
              type: string
  responses:
    "200":
      description: Deletion confirmation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: string
                example: Service deleted successfully.
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

service_delete_multiple:
  tags: [Services]
  summary: Delete multiple services
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [uids]
          properties:
            uids:
              type: array
              items:
                type: string
  responses:
    "200":
      description: Bulk deletion confirmation
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: string
                example: Services deleted successfully.
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

service_create:
  tags: [Services]
  summary: Create a new service
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/ServiceCreateInput"
  responses:
    "200":
      description: Newly created service
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: string
                example: Service added successfully.
              service:
                $ref: "../components/schemas.yaml#/Service"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"
