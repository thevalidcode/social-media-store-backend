add_provider:
  summary: Add a new provider
  description: Add a provider with API key and URL to fetch third-party services.
  tags:
    - Providers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/ProviderCreateRequest"
  responses:
    "200":
      $ref: "../components/responses.yaml#/SuccessResponse"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

get_providers:
  summary: Get all providers
  description: Retrieve all service providers tied to the authenticated admin’s panel.
  tags:
    - Providers
  responses:
    "200":
      description: A list of providers
      content:
        application/json:
          schema:
            type: object
            properties:
              providers:
                type: array
                items:
                  $ref: "../components/schemas.yaml#/Provider"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

update_provider:
  summary: Update provider details
  description: Update a provider's credentials, percentage, and sync settings.
  tags:
    - Providers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/ProviderUpdateRequest"
  responses:
    "200":
      $ref: "../components/responses.yaml#/SuccessWithData"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

delete_provider:
  summary: Delete a provider
  description: Permanently remove a provider from your panel.
  tags:
    - Providers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/DeleteByUid"
  responses:
    "200":
      $ref: "../components/responses.yaml#/SuccessResponse"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

delete_multiple_providers:
  summary: Delete multiple providers
  description: Batch delete providers by passing an array of UIDs.
  tags:
    - Providers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/DeleteMultiple"
  responses:
    "200":
      $ref: "../components/responses.yaml#/SuccessResponse"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

import_provider_services:
  summary: Import provider services
  description: Imports a selection of services from a provider API into your panel with a markup percentage.
  tags:
    - Providers
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/ImportProviderServicesRequest"
  responses:
    "200":
      $ref: "../components/responses.yaml#/SuccessResponse"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/Forbidden"
    "500":
      $ref: "../components/responses.yaml#/ServerError"
