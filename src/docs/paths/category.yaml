get_all_categories:
  tags: [Categories]
  summary: Get all categories
  description: Returns all service categories for a given panel.
  parameters:
    - in: query
      name: panel_id
      required: true
      schema:
        type: number
  responses:
    "200":
      $ref: "../components/responses.yaml#/CategoryListResponse"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

create_category:
  tags: [Categories]
  summary: Create a category
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/CategoryCreateRequest"
  responses:
    "200":
      $ref: "../components/responses.yaml#/CategoryCreatedResponse"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

update_category:
  tags: [Categories]
  summary: Update a category
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/CategoryUpdateRequest"
  responses:
    "200":
      $ref: "../components/responses.yaml#/CategoryUpdatedResponse"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

delete_category:
  tags: [Categories]
  summary: Delete a category
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/DeleteByUid"
  responses:
    "200":
      $ref: "../components/responses.yaml#/SuccessMessage"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

get_category_by_id:
  tags: [Categories]
  summary: Get category by ID
  description: Fetch a single category using category ID and panel ID.
  parameters:
    - in: path
      name: category_id
      required: true
      schema:
        type: number
    - in: query
      name: panel_id
      required: true
      schema:
        type: number
  responses:
    "200":
      $ref: "../components/responses.yaml#/CategoryObject"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "500":
      $ref: "../components/responses.yaml#/ServerError"

delete_multiple_categories:
  tags: [Categories]
  summary: Delete multiple categories
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas.yaml#/DeleteMultiple"
  responses:
    "200":
      $ref: "../components/responses.yaml#/SuccessMessage"
    "400":
      $ref: "../components/responses.yaml#/BadRequest"
    "403":
      $ref: "../components/responses.yaml#/AccessDenied"
    "500":
      $ref: "../components/responses.yaml#/ServerError"
