UserUpdateRequest:
  type: object
  required:
    - uid
  properties:
    uid:
      type: string
      example: "abc123"
    username:
      type: string
      example: "validuser"
    full_name:
      type: string
      example: "Valid Name"
    balance:
      type: number
      example: 100.50
User:
  type: object
  properties:
    id:
      type: string
    email:
      type: string
    username:
      type: string
    password:
      type: string
    status:
      type: string
    key:
      type: string
    role:
      type: string

UserPublic:
  type: object
  additionalProperties:
    type: string | number
  properties:
    id:
      type: string
    email:
      type: string
    username:
      type: string

AuthenticateUser:
  type: object
  required:
    - email
    - password
    - panel_id
  properties:
    panel_id:
      type: number
    email:
      type: string
    password:
      type: string

CreateUserInput:
  type: object
  required:
