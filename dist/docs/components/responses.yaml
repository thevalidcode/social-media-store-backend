UpdateSuccess:
  description: User updated successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: string
            example: update-success

InvalidData:
  description: Request is missing or has invalid fields
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: No valid fields to update

UsersListResponse:
  description: List of users
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: "./schemas.yaml#/User"

UserObject:
  description: Single user data
  content:
    application/json:
      schema:
        type: object
        properties:
          user:
            $ref: "./schemas.yaml#/User"

LoginResponse:
  description: Login success response
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Logged in successfully
          token:
            type: string
          role:
            type: string
          user:
            $ref: "./schemas.yaml#/UserPublic"

SuccessMessage:
  description: Operation successful
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Created Successfully
          token:
            type: string
          user:
            $ref: "./schemas.yaml#/UserPublic"

AccessDenied:
  description: Access denied for non-admins
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Access denied. Admins only.

PanelDataResponse:
  description: Panel Data lookup result
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/PanelData"

DesignStylesResponse:
  description: Design styles configuration
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/DesignStyles"

SiteDataResponse:
  description: General site data
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/SiteData"

ExchangeRatesResponse:
  description: Latest currency exchange rates
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ExchangeRates"

CurrentUserResponse:
  description: Current user record
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/UserPublic"

CurrentAdminResponse:
  description: Current admin record
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/AdminPublic"

NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Panel not found for the given domain

GoogleLoginResponse:
  description: Successful login
  content:
    application/json:
      schema:
        type: object
        properties:
          token:
            type: string
          user:
            $ref: "./schemas.yaml#/User"

Unauthorized:
  description: Authentication failed
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string

ServiceListResponse:
  description: List of available services
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: "./schemas.yaml#/ServicePublic"

SingleServiceResponse:
  description: A single service object
  content:
    application/json:
      schema:
        type: object
        properties:
          service:
            $ref: "./schemas.yaml#/Service"

ServiceCreated:
  description: Service created successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Service added successfully.
          service:
            $ref: "./schemas.yaml#/Service"

ServiceDeleted:
  description: Service deleted successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Service deleted successfully.

ServicesDeleted:
  description: Multiple services deleted successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Services deleted successfully.

ServiceUpdated:
  description: Service updated successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Service updated successfully.
          service:
            $ref: "./schemas.yaml#/Service"

CategoryListResponse:
  description: List of all categories
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: "./schemas.yaml#/Category"

CategoryCreatedResponse:
  description: Successfully created a category
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Category added successfully.
          category:
            $ref: "./schemas.yaml#/Category"

CategoryUpdatedResponse:
  description: Successfully updated a category
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Category updated successfully.
          category:
            $ref: "./schemas.yaml#/Category"

CategoryObject:
  description: Single category object
  content:
    application/json:
      schema:
        type: object
        properties:
          category:
            $ref: "./schemas.yaml#/Category"

SuccessResponse:
  description: Operation successful
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: "Operation completed successfully."

SuccessWithData:
  description: Operation successful with data returned
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: "Provider updated successfully."
          service:
            $ref: "../components/schemas.yaml#/Provider"

BadRequest:
  description: Bad request due to invalid input
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: object
            example:
              body:
                _errors: ["Invalid input"]
                field: ["Field is required"]

Forbidden:
  description: Unauthorized access due to role or permission
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: "Access denied. Admins only."

ServerError:
  description: Internal server error
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: "Something went wrong. Please try again later."
