panel_panel_id:
  get:
    tags:
      - Panel
    summary: Get the internal panel ID for a custom domain
    parameters:
      - in: query
        name: domain
        required: true
        schema:
          type: string
    responses:
      "200":
        $ref: "../components/responses.yaml#/PanelIdResponse"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

panel_styles:
  get:
    tags:
      - Panel
    summary: Get design styles for a panel
    parameters:
      - in: query
        name: panel_id
        required: true
        schema:
          type: string
    responses:
      "200":
        $ref: "../components/responses.yaml#/DesignStylesResponse"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

panel_site_data:
  get:
    tags:
      - Panel
    summary: Get general site data for a panel
    parameters:
      - in: query
        name: panel_id
        required: true
        schema:
          type: string
    responses:
      "200":
        $ref: "../components/responses.yaml#/SiteDataResponse"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

panel_rates:
  get:
    tags:
      - Panel
    summary: Get latest exchange rates
    responses:
      "200":
        $ref: "../components/responses.yaml#/ExchangeRatesResponse"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

panel_current_user:
  get:
    tags:
      - Panel
    summary: Get the currently authenticated user
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: uid
        required: true
        schema:
          type: string
    responses:
      "200":
        $ref: "../components/responses.yaml#/CurrentUserResponse"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/ServerError"

panel_current_admin:
  get:
    tags:
      - Panel
    summary: Get the currently authenticated admin
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: uid
        required: true
        schema:
          type: string
    responses:
      "200":
        $ref: "../components/responses.yaml#/CurrentAdminResponse"
      "403":
        $ref: "../components/responses.yaml#/AccessDenied"
      "404":
        $ref: "../components/responses.yaml#/NotFound"
      "500":
        $ref: "../components/responses.yaml#/ServerError"
