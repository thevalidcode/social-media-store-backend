name: 🚀 Deploy project on push

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy project
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🧼 Clean previous builds
        run: rm -rf dist

      - name: 🛠️ Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: 🗂 Ensure dist/public exists and copy public assets
        run: |
          mkdir -p dist/public
          if [ -d "src/public" ]; then
            cp -r src/public/* dist/public/
          else
            echo "No public folder found, skipping static asset copy"
          fi

      - name: 📦 Copy package.json to build output
        run: cp package.json dist/

      - name: 🔍 Check dist output before deploy
        run: ls -la dist

      - name: 📂 Deploy to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "dist/*"
          target: "."
