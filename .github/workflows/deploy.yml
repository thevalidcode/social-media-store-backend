name: 🚀 Deploy project on push

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy project
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🧼 Clean previous builds
        run: rm -rf dist

      - name: 🛠️ Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: 🗂 Ensure dist/public exists and copy public assets
        run: |
          mkdir -p dist/public
          if [ -d "src/public" ]; then
            cp -r src/public/* dist/public/
          else
            echo "No public folder found, skipping static asset copy"
          fi

      - name: 📦 Copy package.json to build output
        run: cp package.json dist/

      - name: 📂 Sync to production via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./dist/"
