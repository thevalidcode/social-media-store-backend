UpdateSuccess:
  description: User updated successfully
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: string
            example: update-success

InvalidData:
  description: Request is missing or has invalid fields
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: No valid fields to update

UsersListResponse:
  description: List of users
  content:
    application/json:
      schema:
        type: array
        items:
          $ref: "./schemas.yaml#/User"

UserObject:
  description: Single user data
  content:
    application/json:
      schema:
        type: object
        properties:
          user:
            $ref: "./schemas.yaml#/User"

LoginResponse:
  description: Login success response
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Logged in successfully
          token:
            type: string
          user:
            $ref: "./schemas.yaml#/UserPublic"

SuccessMessage:
  description: Operation successful
  content:
    application/json:
      schema:
        type: object
        properties:
          success:
            type: string
            example: Created Successfully

BadRequest:
  description: Missing or invalid input
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Missing required field

AccessDenied:
  description: Access denied for non-admins
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Access denied. Admins only.

ServerError:
  description: Unexpected internal error
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Error performing request.

PanelIdResponse:
  description: Panel ID lookup result
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/PanelId"

DesignStylesResponse:
  description: Design styles configuration
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/DesignStyles"

SiteDataResponse:
  description: General site data
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/SiteData"

ExchangeRatesResponse:
  description: Latest currency exchange rates
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/ExchangeRates"

CurrentUserResponse:
  description: Current user record
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/UserPublic"

CurrentAdminResponse:
  description: Current admin record
  content:
    application/json:
      schema:
        $ref: "./schemas.yaml#/AdminPublic"

NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
            example: Panel not found for the given domain

GoogleLoginResponse:
  description: Successful login
  content:
    application/json:
      schema:
        type: object
        properties:
          token:
            type: string
          user:
            $ref: "./schemas.yaml#/User"

Unauthorized:
  description: Authentication failed
  content:
    application/json:
      schema:
        type: object
        properties:
          error:
            type: string
